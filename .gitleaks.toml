title = "Consistem LMS Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic AUTH_SECRET used by historical unit tests"
regexTarget = "secret"
regexes = [
  '''0123456789abcdefghijklmnopqrstuv''',
]

[[allowlists]]
description = "Public localStorage identifier detected as a generic API key"
regexTarget = "secret"
regexes = [
  '''consistem_lms_lesson_plan_v1''',
]
